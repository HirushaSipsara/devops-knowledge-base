name: Staging CI/CD

on:
  push:
    branches:
      - Dev

jobs:
  ci:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest tests/ -v

  deploy:
    name: Deploy to staging EC2
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Pull, build, and replace application container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATABASE_URL_B64="$(printf '%s' "${DATABASE_URL}" | base64 --wrap=0)"
          ssh "ubuntu@${EC2_HOST}" -p 22 "bash -s -- ${DATABASE_URL_B64}" <<'REMOTE_SCRIPT'
          set -e

          DATABASE_URL="$(printf '%s' "$1" | base64 --decode)"

          cd /home/ubuntu/devops-knowledge-base
          git pull origin Dev

          sudo docker build -t devops-knowledge-base:latest .

          sudo docker stop devops-kb-app || true
          sudo docker rm devops-kb-app || true

          sudo docker run -d \
            --name devops-kb-app \
            --network devops-kb-network \
            -p 8000:8000 \
            -e "DATABASE_URL=${DATABASE_URL}" \
            devops-knowledge-base:latest
          REMOTE_SCRIPT
