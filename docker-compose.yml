version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: devops-kb-db
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_pass
      POSTGRES_DB: devops_kb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d devops_kb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-kb-web
    command: sh -c "python seed_data.py && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://devops_user:devops_pass@db:5432/devops_kb
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
